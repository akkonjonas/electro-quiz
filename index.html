<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Electro Quiz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;
  --acc:#f5b301;--acc2:#ffd25a;--ok:#2ecc71;--bad:#ff5d5d;--r:16px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f1f4;--line:#e0e3ea;--txt:#16181d;--mut:#6a7282;--acc:#e09f00;--acc2:#b87f00}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:18px 16px}
h1,h2,h3,h4,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:.3px;font-size:20px}
.brand span{color:var(--acc)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--mut);font:inherit;font-size:13px}
.chip b{color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hello{margin-bottom:16px}
.hello h2{font-size:22px}
.hello p{color:var(--mut);font-size:14px;margin-top:4px}
.hello p b{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--acc)}
.stat small{color:var(--mut);font-size:12px}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 2px 10px}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.lv:active{transform:scale(.99)}
.lv.lock{opacity:.45;cursor:not-allowed}
.lv.hl{border-color:var(--acc)}
.ico{width:46px;height:46px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.lv .t{flex:1;min-width:0}
.lv h3{font-size:16px}
.lv p{font-size:13px;color:var(--mut);margin-top:3px}
.stars{font-size:15px;letter-spacing:2px;color:var(--acc);white-space:nowrap}
.stars i{color:var(--line);font-style:normal}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--acc);color:#1a1300}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
input.in{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:17px;margin:14px 0;outline:none}
input.in:focus{border-color:var(--acc)}
.login{padding-top:8vh;text-align:center}
.login .bolt{font-size:54px}
.login h1{font-size:30px;margin:8px 0 6px}
.login p{color:var(--mut);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar>div{height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;gap:10px}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 15px;margin-bottom:10px;font:inherit;font-size:16px;line-height:1.35;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:rgba(46,204,113,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,93,93,.12)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:15px;margin:6px 0 14px;font-size:15px;line-height:1.5;border:1px solid var(--line);background:var(--card)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb h4{margin:0 0 8px;font-size:16px}
.fb .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:10px 0 3px}
.res{text-align:center;padding-top:4vh}
.res .big{font-size:64px;margin:6px 0}
.res h2{font-size:26px}
.res .pts{font-size:42px;font-weight:800;color:var(--acc);margin:8px 0}
.res p{color:var(--mut)}
.newb{margin:18px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badge{background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;font-size:14px}
table{width:100%;border-collapse:collapse}
td,th{padding:12px 8px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
td.n,th.n{text-align:right}
td small{display:block;color:var(--mut);font-size:12px}
tr.me td{color:var(--acc);font-weight:700}
.pos{width:34px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.bd .e{font-size:30px}
.bd h4{margin:6px 0 3px;font-size:14px}
.bd p{font-size:12px;color:var(--mut)}
.bd.off{opacity:.4;filter:grayscale(1)}
.bd.on{border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
.link{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.err{padding:30px 10px;text-align:center;color:var(--bad)}
</style>
</head>

<body>
<div id="app"></div>
<nav id="nav" style="display:none"><div>
  <button id="n-home" onclick="goHome()"><span>🏠</span>Niveles</button>
  <button id="n-rank" onclick="goRank()"><span>🏆</span>Ranking</button>
  <button id="n-badge" onclick="goBadges()"><span>🎖️</span>Premios</button>
</div>
<div class="credit" style="text-align: center; width: 100%;">© Siva Jonás 2026 - V.1.0</div>
</nav>

<script src="preguntas.js"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const KEY = "electro_quiz_v2", OLDKEY = "electro_quiz_v1";
const PASS = 70;          // % para aprobar un nivel
const FINAL_Q = 20;       // preguntas del examen final
const REV_Q = 10;         // preguntas por tanda de repaso

const LEVELS = [
  {id:1,  icon:"⚖️", name:"Leyes y seguridad",        desc:"Ley 10.281, ERSeP, categorías y APTO"},
  {id:2,  icon:"⚡", name:"Electricidad y corriente", desc:"CC, CA, trifásica y colores"},
  {id:3,  icon:"🧱", name:"Materiales y aislantes",   desc:"Aislantes, conductores y cables IRAM"},
  {id:4,  icon:"🔢", name:"Matemática y Ley de Ohm",  desc:"Porcentajes, redondeo y V = I × R"},
  {id:5,  icon:"💡", name:"Potencia y energía",       desc:"P = V × I, kWh y potencia aparente"},
  {id:6,  icon:"⚙️", name:"Potencia aplicada",        desc:"Hp, cos φ, trifásica y planillas"},
  {id:7,  icon:"📉", name:"Caída de tensión",         desc:"Resistencia, sección y límites 3% / 5%"},
  {id:8,  icon:"🏠", name:"Red y acometida",          desc:"RDD, DPLA, LAD, pilar y medidor"},
  {id:9,  icon:"🗃️", name:"TPA y circuito seccional", desc:"ITM, zanja, cables y corrientes"},
  {id:10, icon:"🛡️", name:"TPU y protecciones",       desc:"ITM, ID, PIA, curvas y puente peine"},
  {id:11, icon:"🌍", name:"Puesta a tierra",          desc:"Sistema TT, jabalina y choques"},
  {id:12, icon:"🔩", name:"Canalizaciones",           desc:"Cañerías, curvas, soportes y distancias"},
  {id:13, icon:"🔌", name:"Cables y bandejas",        desc:"Cables permitidos y canalización subterránea"},
  {id:14, icon:"📐", name:"Planos y proyecto",        desc:"IRAM, Sla, GE, unifilar y DPMS"}
];
const FINAL = {id:"F", icon:"🏆", name:"Examen final", desc:"20 preguntas al azar de todo el curso"};

const BADGES = [
  {id:"first",   e:"🌱", n:"Primer paso",        d:"Completá tu primer nivel"},
  {id:"streak5", e:"🔥", n:"En racha",           d:"5 correctas seguidas"},
  {id:"streak10",e:"☄️", n:"Racha de acero",     d:"10 correctas seguidas"},
  {id:"perfect", e:"💯", n:"Nivel perfecto",     d:"100% en un nivel"},
  {id:"perfect3",e:"🏅", n:"Triple perfecto",    d:"100% en 3 niveles"},
  {id:"pts500",  e:"🔋", n:"500 puntos",         d:"Sumá 500 puntos"},
  {id:"pts1000", e:"💡", n:"1000 puntos",        d:"Sumá 1000 puntos"},
  {id:"pts1500", e:"🌟", n:"1500 puntos",        d:"Sumá 1500 puntos"},
  {id:"lv3",     e:"🪜", n:"Aprendiz avanzado",  d:"Aprobá 3 niveles"},
  {id:"lv7",     e:"🧰", n:"Mitad del camino",   d:"Aprobá 7 niveles"},
  {id:"calc",    e:"🧮", n:"Calculista",         d:"90% o más en los niveles 4, 5, 6 y 7"},
  {id:"stars30", e:"🌠", n:"Cielo estrellado",   d:"Juntá 30 estrellas"},
  {id:"fixer",   e:"🛠️", n:"Cazador de errores", d:"Corregí 10 errores en el repaso"},
  {id:"all",     e:"🎓", n:"Teoría completa",    d:"Aprobá los 14 niveles"},
  {id:"final",   e:"🏆", n:"Electricista del curso", d:"Aprobá el examen final"}
];

const TITLES = [
  {min:0,    t:"Aprendiz"},
  {min:200,  t:"Ayudante"},
  {min:600,  t:"Medio oficial"},
  {min:1100, t:"Oficial"},
  {min:1700, t:"Instalador"},
  {min:2200, t:"Maestro instalador"}
];

/* ============ ESTADO ============ */
const $ = s => document.querySelector(s);
const app = $("#app");
let S = null;

if (typeof Q === "undefined") {
  app.innerHTML = '<div class="err"><h2>No se pudo cargar preguntas.js</h2><p>Revisá que el archivo exista en la misma carpeta que index.html y que no tenga errores de escritura.</p></div>';
  throw new Error("Falta preguntas.js");
}
const ALL = [];
Object.keys(Q).forEach(k => Q[k].forEach(a => ALL.push({lv:+k, a})));

function newPlayer(){ return {levels:{}, badges:[], bestStreak:0, wrong:[], fixed:0}; }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.players) return d;
  } catch(e){}
  const fresh = {players:{}, current:null};
  try { // conserva los nombres de la versión anterior
    const o = JSON.parse(localStorage.getItem(OLDKEY));
    if (o && o.players) Object.keys(o.players).forEach(n => fresh.players[n] = newPlayer());
  } catch(e){}
  return fresh;
}
let db = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
function fix(p){ p.levels = p.levels||{}; p.badges = p.badges||[]; p.wrong = p.wrong||[]; p.fixed = p.fixed||0; p.bestStreak = p.bestStreak||0; return p; }
const me = () => fix(db.players[db.current]);
const total = p => Object.values(p.levels).reduce((a,l)=>a+l.score,0);
const starsTot = p => Object.values(p.levels).reduce((a,l)=>a+l.stars,0);
const doneCount = p => LEVELS.filter(l => p.levels[l.id] && p.levels[l.id].pct >= PASS).length;
const titleFor = pts => TITLES.filter(x => pts >= x.min).pop().t;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const starsHTML = n => "★".repeat(n) + "<i>" + "★".repeat(3-n) + "</i>";
function unlocked(id){
  const p = me();
  if (id === "F") return doneCount(p) === LEVELS.length;
  if (id === 1) return true;
  const prev = p.levels[id-1];
  return !!(prev && prev.pct >= PASS);
}
function ranking(){
  return Object.entries(db.players).map(([n,p])=>{ fix(p); return {n, pts:total(p), st:starsTot(p), done:doneCount(p)}; })
    .sort((a,b)=>b.pts-a.pts || b.st-a.st || a.n.localeCompare(b.n));
}
function setNav(id){
  $("#nav").style.display = id ? "block" : "none";
  ["home","rank","badge"].forEach(k=>$("#n-"+k).classList.toggle("on", k===id));
}

/* ============ PANTALLAS ============ */
function screenLogin(){
  setNav(null);
  const names = Object.keys(db.players);
  app.innerHTML = `
  <div class="login">
    <div class="bolt">⚡</div>
    <h1>Electro <span style="color:var(--acc)">Quiz</span></h1>
    <p>Curso de Electricidad Domiciliaria y Pequeños Locales Comerciales</p>
    <input id="nm" class="in" maxlength="20" placeholder="Escribí tu nombre" autocomplete="off">
    <button class="btn" onclick="doLogin()">Empezar</button>
    ${names.length ? `<div class="chips">${names.map((n,i)=>`<button onclick="pickPlayer(${i})">${esc(n)}</button>`).join("")}</div>
    <p class="note">Tocá un nombre para continuar con tu progreso.</p>` : ""}
  </div>`;
  $("#nm").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}
function doLogin(){
  const v = $("#nm").value.trim().slice(0,20);
  if(!v){ $("#nm").focus(); return; }
  const key = Object.keys(db.players).find(n=>n.toLowerCase()===v.toLowerCase()) || v;
  if(!db.players[key]) db.players[key] = newPlayer();
  db.current = key; save(); screenHome();
}
function pickPlayer(i){ db.current = Object.keys(db.players)[i]; save(); screenHome(); }
function logout(){ db.current=null; save(); screenLogin(); }
function goHome(){ screenHome(); }
function goRank(){ screenRank(); }
function goBadges(){ screenBadges(); }

function levelCard(L){
  const p = me(), lv = p.levels[L.id], open = unlocked(L.id);
  const label = L.id==="F" ? "Examen final" : `Nivel ${L.id} · ${L.name}`;
  const sub = open ? (lv ? `Mejor: ${lv.pct}% · ${lv.score} pts` : L.desc)
                   : (L.id==="F" ? "Aprobá los 14 niveles para desbloquearlo" : "Aprobá el nivel anterior");
  const act = open ? `startSession('${L.id==="F"?"final":"lv"}',${L.id==="F"?0:L.id})` : "";
  return `<button class="lv ${open?"":"lock"} ${L.id==="F"&&open?"hl":""}" onclick="${act}">
    <div class="ico">${open?L.icon:"🔒"}</div>
    <div class="t"><h3>${label}</h3><p>${sub}</p></div>
    <div class="stars">${starsHTML(lv?lv.stars:0)}</div></button>`;
}

function screenHome(){
  if(!db.current || !db.players[db.current]) return screenLogin();
  setNav("home");
  const p = me(), pts = total(p);
  const pos = ranking().findIndex(r=>r.n===db.current)+1;
  const done = doneCount(p);
  const nw = p.wrong.filter(t => ALL.some(x=>x.a[0]===t)).length;
  app.innerHTML = `
  <div class="top"><div class="brand">Electro <span>Quiz</span></div>
    <button class="chip" onclick="logout()" style="cursor:pointer">👤 <b>${esc(db.current)}</b></button></div>
  <div class="hello"><h2>Hola, ${esc(db.current)}</h2><p>Rango: <b>${titleFor(pts)}</b> · Aprobá cada nivel con ${PASS}% o más para avanzar.</p></div>
  <div class="stats">
    <div class="stat"><b>${pts}</b><small>Puntos</small></div>
    <div class="stat"><b>#${pos}</b><small>Posición</small></div>
    <div class="stat"><b>${done}/${LEVELS.length}</b><small>Niveles</small></div>
  </div>
  <div class="bar"><div style="width:${done/LEVELS.length*100}%"></div></div>
  ${nw ? `<button class="lv hl" onclick="startSession('rev',0)">
    <div class="ico">🛠️</div><div class="t"><h3>Repasar errores</h3><p>${nw} pregunta${nw===1?"":"s"} para reforzar</p></div></button>` : ""}
  <div class="sec">Niveles</div>
  ${LEVELS.map(levelCard).join("")}
  <div class="sec">Desafío</div>
  ${levelCard(FINAL)}
  <p class="note">${ALL.length} preguntas · tu progreso se guarda en este teléfono.</p>`;
  window.scrollTo(0,0);
}

/* ---------- Sesión de preguntas ---------- */
function mk(a, lv){
  return {q:a[0], c:a[5], x:a[6], lv, opts: shuffle([a[1],a[2],a[3],a[4]].map((t,i)=>({t, ok:i===0})))};
}
function startSession(mode, id){
  let qs = [];
  if (mode==="lv") qs = shuffle(Q[id]).map(a=>mk(a,id));
  else if (mode==="final") qs = shuffle(ALL).slice(0,FINAL_Q).map(x=>mk(x.a,x.lv));
  else { const w = me().wrong; qs = shuffle(ALL.filter(x=>w.includes(x.a[0]))).slice(0,REV_Q).map(x=>mk(x.a,x.lv)); }
  if(!qs.length){ screenHome(); return; }
  S = {mode, id: mode==="final" ? "F" : id, qs, i:0, score:0, ok:0, streak:0, maxStreak:0, done:false};
  screenQuestion();
}
function sessionLabel(){
  if (S.mode==="final") return "🏆 Examen final";
  if (S.mode==="rev") return "🛠️ Repaso de errores";
  const L = LEVELS[S.id-1]; return `${L.icon} Nivel ${L.id} · ${L.name}`;
}
function screenQuestion(){
  setNav(null);
  const q = S.qs[S.i];
  app.innerHTML = `
  <div class="qhead"><span>${sessionLabel()}</span><span>${S.i+1}/${S.qs.length}</span></div>
  <div class="bar"><div style="width:${(S.i/S.qs.length)*100}%"></div></div>
  <div class="qhead"><span>Racha: ${S.streak} 🔥</span><span>${S.mode==="rev"?"Sin puntos":S.score+" pts"}</span></div>
  <h2 class="q">${esc(q.q)}</h2>
  <div id="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="answer(${i})">${esc(o.t)}</button>`).join("")}</div>
  <div id="fb"></div>
  <button class="link" onclick="quitQuiz()">Salir</button>`;
  window.scrollTo(0,0);
}
function answer(i){
  if(S.done) return;
  S.done = true;
  const p = me(), q = S.qs[S.i], good = q.opts[i].ok;
  const btns = document.querySelectorAll(".opt");
  q.opts.forEach((o,k)=>{
    if(o.ok) btns[k].classList.add("ok");
    else if(k===i) btns[k].classList.add("bad");
    else btns[k].classList.add("dim");
  });
  let gain = 0;
  if(good){
    S.ok++; S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak);
    if(S.mode!=="rev"){ gain = 10 + (S.streak>=3 ? 5 : 0); S.score += gain; }
    else p.fixed++;
    p.wrong = p.wrong.filter(t => t !== q.q);
  } else {
    S.streak = 0;
    if(!p.wrong.includes(q.q)) p.wrong.push(q.q);
  }
  save();
  const right = q.opts.find(o=>o.ok).t;
  const last = S.i === S.qs.length-1;
  const nextBtn = `<button class="btn" onclick="next()">${last?"Ver resultado":"Siguiente"}</button>`;
  $("#fb").innerHTML = good ? `
    <div class="fb ok"><h4>✅ ¡Correcto!${gain?` +${gain} pts`:""}</h4>
    <span class="lbl">Concepto</span>${esc(q.c)}
    <span class="lbl">Para ampliar</span>${esc(q.x)}</div>${nextBtn}` : `
    <div class="fb bad"><h4>❌ Incorrecto</h4>
    <span class="lbl">Respuesta correcta</span><b>${esc(right)}</b>
    <span class="lbl">Concepto correcto</span>${esc(q.c)}</div>${nextBtn}`;
  $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function next(){
  S.i++; S.done = false;
  if(S.i >= S.qs.length) return finish();
  screenQuestion();
}
function quitQuiz(){ if(confirm("¿Salir? Se pierde el progreso de esta partida (las respuestas ya dadas quedan registradas para el repaso).")){ S=null; screenHome(); } }

function awardBadges(p){
  const got = [], L = p.levels;
  const give = id => { if(!p.badges.includes(id)){ p.badges.push(id); got.push(BADGES.find(b=>b.id===id)); } };
  const pts = total(p), perf = Object.values(L).filter(v=>v.pct===100).length, done = doneCount(p);
  if(Object.keys(L).length) give("first");
  if(p.bestStreak>=5) give("streak5");
  if(p.bestStreak>=10) give("streak10");
  if(perf>=1) give("perfect");
  if(perf>=3) give("perfect3");
  if(pts>=500) give("pts500");
  if(pts>=1000) give("pts1000");
  if(pts>=1500) give("pts1500");
  if(done>=3) give("lv3");
  if(done>=7) give("lv7");
  if([4,5,6,7].every(k=>L[k] && L[k].pct>=90)) give("calc");
  if(starsTot(p)>=30) give("stars30");
  if(p.fixed>=10) give("fixer");
  if(done>=LEVELS.length) give("all");
  if(L.F && L.F.pct>=PASS) give("final");
  return got;
}

function finish(){
  const p = me(), n = S.qs.length;
  const pct = Math.round(S.ok/n*100);
  p.bestStreak = Math.max(p.bestStreak, S.maxStreak);

  if(S.mode==="rev"){
    const got = awardBadges(p); save();
    const left = p.wrong.filter(t => ALL.some(x=>x.a[0]===t)).length;
    app.innerHTML = `
    <div class="res">
      <div class="big">🛠️</div>
      <h2>Repaso terminado</h2>
      <p>${S.ok} de ${n} corregidas${left?` · te quedan ${left} por reforzar`:" · ¡no te quedan errores pendientes!"}</p>
      ${got.length?`<div class="newb">${got.map(b=>`<div class="badge">${b.e} <b>${b.n}</b></div>`).join("")}</div>`:""}
      <div style="margin-top:18px">
        ${left?`<button class="btn" onclick="startSession('rev',0)">Seguir repasando</button>`:""}
        <button class="btn ${left?"ghost":""}" onclick="screenHome()">Volver al inicio</button>
      </div>
    </div>`;
    S = null; window.scrollTo(0,0); return;
  }

  const stars = pct===100 ? 3 : pct>=85 ? 2 : pct>=PASS ? 1 : 0;
  const prev = p.levels[S.id];
  p.levels[S.id] = {
    score: Math.max(S.score, prev?prev.score:0),
    pct: Math.max(pct, prev?prev.pct:0),
    stars: Math.max(stars, prev?prev.stars:0)
  };
  const got = awardBadges(p);
  save();
  const passed = pct>=PASS, isFinal = S.mode==="final", lv = S.id;
  const nextOpen = !isFinal && passed && (lv < LEVELS.length || unlocked("F"));
  const nextAct = lv < LEVELS.length ? `startSession('lv',${lv+1})` : `startSession('final',0)`;
  const nextTxt = lv < LEVELS.length ? "Siguiente nivel" : "Ir al examen final";
  const again = isFinal ? "startSession('final',0)" : `startSession('lv',${lv})`;
  const wrongLeft = p.wrong.length;
  app.innerHTML = `
  <div class="res">
    <div class="big">${passed?"🎉":"💪"}</div>
    <h2>${passed?(isFinal?"¡Examen final aprobado!":"¡Nivel aprobado!"):"Casi lo lográs"}</h2>
    <p>${S.ok} de ${n} correctas · ${pct}%</p>
    <div class="pts">+${S.score}</div>
    <div class="stars" style="font-size:30px">${starsHTML(stars)}</div>
    <p style="margin-top:10px">${passed?"Seguí así.":`Necesitás ${PASS}% para aprobar. Repasá los conceptos y probá de nuevo.`}</p>
    ${got.length?`<div class="newb">${got.map(b=>`<div class="badge">${b.e} <b>${b.n}</b></div>`).join("")}</div>`:""}
    <div style="margin-top:18px">
      ${nextOpen?`<button class="btn" onclick="${nextAct}">${nextTxt}</button>`:""}
      <button class="btn ${nextOpen?"ghost":""}" onclick="${again}">${isFinal?"Repetir examen":"Repetir nivel"}</button>
      ${wrongLeft?`<button class="btn ghost" onclick="startSession('rev',0)">Repasar errores (${wrongLeft})</button>`:""}
      <button class="btn ghost" onclick="screenHome()">Volver al inicio</button>
    </div>
  </div>`;
  S = null;
  window.scrollTo(0,0);
}

function screenRank(){
  if(!db.current || !db.players[db.current]) return screenLogin();
  setNav("rank");
  const r = ranking();
  const medal = i => ["🥇","🥈","🥉"][i] || (i+1);
  app.innerHTML = `
  <div class="top"><div class="brand">Ranking</div></div>
  <div class="card"><table>
    <tr><th class="pos">#</th><th>Jugador</th><th class="n">★</th><th class="n">Puntos</th></tr>
    ${r.map((x,i)=>`<tr class="${x.n===db.current?"me":""}"><td class="pos">${medal(i)}</td>
      <td>${esc(x.n)}<small>${titleFor(x.pts)} · ${x.done}/${LEVELS.length} niveles</small></td>
      <td class="n">${x.st}</td><td class="n">${x.pts}</td></tr>`).join("")}
  </table></div>
  <p class="note">El ranking incluye a todos los que juegan en este dispositivo.</p>`;
  window.scrollTo(0,0);
}

function screenBadges(){
  if(!db.current || !db.players[db.current]) return screenLogin();
  setNav("badge");
  const p = me();
  app.innerHTML = `
  <div class="top"><div class="brand">Premios</div><div class="chip"><b>${p.badges.length}</b>/${BADGES.length}</div></div>
  <div class="bgrid">${BADGES.map(b=>{
    const on = p.badges.includes(b.id);
    return `<div class="bd ${on?"on":"off"}"><div class="e">${b.e}</div><h4>${b.n}</h4><p>${b.d}</p></div>`;
  }).join("")}</div>
  <div class="sec">Rangos</div>
  <div class="card"><table>
    ${TITLES.map(t=>`<tr class="${titleFor(total(p))===t.t?"me":""}"><td>${t.t}</td><td class="n">${t.min} pts</td></tr>`).join("")}
  </table></div>`;
  window.scrollTo(0,0);
}

/* ============ INICIO ============ */
if(db.current && db.players[db.current]) screenHome(); else screenLogin();

if("serviceWorker" in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
